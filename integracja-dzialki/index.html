<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPA – integracja WFS działek</title></head><body><div style="font-family:Arial,sans-serif;padding:20px">Ładowanie wersji integracyjnej…</div><script>(async()=>{const SOURCE='https://raw.githubusercontent.com/denem1984/analizator-nieruchomosci/main/index.html';const API='https://analizator-nieruchomosci-api.onrender.com/api/wfs';try{let html=await (await fetch(SOURCE,{cache:'no-store'})).text();html=html.replace(/const parcelWfs="[^"]+"/,'const parcelWfs="'+API+'"');html=html.replace(/const parcelLabels=L\.layerGroup\(\),parcelLabelsWms=L\.tileLayer\.wms\([\s\S]*?\);let parcelLabelTimer=/,'const parcelLabels=L.layerGroup(),parcelLabelsWms=null;let parcelLabelTimer=');html=html.replace(/if\(map\.hasLayer\(parcelLabelsWms\)\)map\.removeLayer\(parcelLabelsWms\);/g,'');html=html.replace(/if\(!map\.hasLayer\(parcelLabelsWms\)\)map\.addLayer\(parcelLabelsWms\);/g,'');html=html.replace(/count:"2000",propertyName:"id_dzialki,geom"/,'count:"2000",propertyName:"id_dzialki,geom"');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="font-family:Arial,sans-serif;color:#991b1b">Nie udało się uruchomić wersji integracyjnej. '+String(e)+'</pre>'}})();</script></body></html>
