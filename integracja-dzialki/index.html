<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPA – integracja WFS działek</title></head><body><div style="font-family:Arial,sans-serif;padding:20px">Ładowanie wersji integracyjnej…</div><script>(async()=>{const SOURCE='https://raw.githubusercontent.com/denem1984/analizator-nieruchomosci/main/index.html',API='https://analizator-nieruchomosci-api.onrender.com/api/wfs';try{let html=await(await fetch(SOURCE,{cache:'no-store'})).text();html=html.replace('Math.min(15,10+(z-13)*.72)','Math.min(16,10+(z-13)*.72)');function replaceFunction(src,signature,replacement){const start=src.indexOf(signature);if(start<0)throw Error('Nie znaleziono '+signature);const brace=start+signature.length-1;let depth=0,state='code',esc=false;for(let i=brace;i<src.length;i++){const c=src[i],n=src[i+1];if(state==='single'||state==='double'||state==='template'){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if((state==='single'&&c==="'")||(state==='double'&&c==='"')||(state==='template'&&c==='`'))state='code';continue}if(c==="'"){state='single';continue}if(c==='"'){state='double';continue}if(c==='`'){state='template';continue}if(c==='/'&&n==='/'){state='linecomment';i++;continue}if(c==='/'&&n==='*'){state='blockcomment';i++;continue}if(c==='{')depth++;else if(c==='}'&&--depth===0)return src.slice(0,start)+replacement+src.slice(i+1)}throw Error('Nie znaleziono końca funkcji '+signature)}const newLoader='async function loadParcelLabels(){if(!document.getElementById("kieg").checked||map.getZoom()<13){clearParcelLabels();if(map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms);return}const my=++parcelLabelRequest,b=map.getBounds(),pad=.12,latSpan=b.getNorth()-b.getSouth(),lonSpan=b.getEast()-b.getWest(),south=b.getSouth()-latSpan*pad,north=b.getNorth()+latSpan*pad,west=b.getWest()-lonSpan*pad,east=b.getEast()+lonSpan*pad,u=new URL(API);u.searchParams.set("bbox",`${south},${west},${north},${east},EPSG:4326`);u.searchParams.set("count","1000");try{const res=await fetch(u,{headers:{Accept:"application/json"}});if(!res.ok)throw Error("HTTP "+res.status);const data=await res.json();if(my!==parcelLabelRequest)return;const fs=(data.features||[]).filter(f=>f&&f.geometry&&f.properties);renderParcelLabels(fs);if(map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms)}catch(e){console.warn("WFS API etykiety działek:",e);if(my===parcelLabelRequest)clearParcelLabels();if(map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms)}}';html=replaceFunction(html,'async function loadParcelLabels(){',newLoader);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="font-family:Arial,sans-serif;color:#991b1b">Błąd uruchamiania integracji: '+String(e)+'</pre>'}})();</script></body></html>
