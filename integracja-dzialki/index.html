<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPA – integracja WFS działek</title></head><body><div style="font-family:Arial,sans-serif;padding:20px">Ładowanie wersji integracyjnej…</div><script>(async()=>{const SOURCE='https://raw.githubusercontent.com/denem1984/analizator-nieruchomosci/main/index.html',API='https://analizator-nieruchomosci-api.onrender.com/api/wfs';try{let html=await(await fetch(SOURCE,{cache:'no-store'})).text();html=html.replace('const parcelWfs="https://mapy.geoportal.gov.pl/wss/service/PZGIK/EGIB/WFS/UslugaZbiorcza"','const parcelWfs="'+API+'"');html=html.replace('Math.min(15,10+(z-13)*.72)','Math.min(16,10+(z-13)*.72)');const patch='<script>(function(){const API='+JSON.stringify(API)+';function install(){try{if(typeof parcelLabelsWms!=="undefined"&&map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms);loadParcelLabels=async function(){if(!document.getElementById("kieg").checked||map.getZoom()<13){clearParcelLabels();if(typeof parcelLabelsWms!=="undefined"&&map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms);return}const my=++parcelLabelRequest,b=map.getBounds(),pad=.12,latSpan=b.getNorth()-b.getSouth(),lonSpan=b.getEast()-b.getWest(),south=b.getSouth()-latSpan*pad,north=b.getNorth()+latSpan*pad,west=b.getWest()-lonSpan*pad,east=b.getEast()+lonSpan*pad,u=new URL(API);u.searchParams.set("bbox",`${south},${west},${north},${east},EPSG:4326`);try{const res=await fetch(u,{headers:{Accept:"application/json"}});if(!res.ok)throw Error("HTTP "+res.status);const data=await res.json();if(my!==parcelLabelRequest)return;const fs=(data.features||[]).filter(f=>f&&f.geometry&&f.properties);renderParcelLabels(fs);if(typeof parcelLabelsWms!=="undefined"&&map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms)}catch(e){console.warn("WFS API etykiety działek:",e);if(my===parcelLabelRequest)clearParcelLabels();if(typeof parcelLabelsWms!=="undefined"&&map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms)}};setTimeout(function(){if(typeof parcelLabelsWms!=="undefined"&&map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms);loadParcelLabels()},0)}catch(e){console.warn("Integracja etykiet:",e)}}setTimeout(install,0)})();<\/script>';html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="font-family:Arial,sans-serif;color:#991b1b">Błąd uruchamiania integracji: '+String(e)+'</pre>'}})();</script></body></html>
