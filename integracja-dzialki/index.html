<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPA – integracja WFS działek</title></head><body><div style="font-family:Arial,sans-serif;padding:20px">Ładowanie wersji integracyjnej…</div><script>(async()=>{const SOURCE='https://raw.githubusercontent.com/denem1984/analizator-nieruchomosci/main/index.html',API='https://analizator-nieruchomosci-api.onrender.com/api/wfs';try{let html=await(await fetch(SOURCE,{cache:'no-store'})).text();const bridge=`<script>(function(){const API=${JSON.stringify(API)},nativeFetch=window.fetch.bind(window);window.fetch=function(input,init){try{const u=new URL(typeof input==='string'?input:input.url,location.href);if(u.href.includes('/WFS/UslugaZbiorcza')){const b=u.searchParams.get('bbox');if(b){const api=new URL(API);api.searchParams.set('bbox',b);return nativeFetch(api.toString(),init)}}}catch(e){}return nativeFetch(input,init)}})();<\/script>`;html=html.replace('</head>',bridge+'</head>');html=html.replace(/Math\.min\(15,10\+\(z-13\)\*\.72\)/,'Math.min(16,10+(z-13)*.72)');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="font-family:Arial,sans-serif;color:#991b1b">Błąd uruchamiania integracji: '+String(e)+'</pre>'}})();</script></body></html>
