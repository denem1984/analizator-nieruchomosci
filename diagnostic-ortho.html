<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostyka ortofotomapy – WMTS GetCapabilities</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{height:100%;margin:0;font-family:Arial,sans-serif}body{display:flex;flex-direction:column}#top{padding:10px;background:#f1f5f9;border-bottom:1px solid #cbd5e1;font-size:13px;line-height:1.45}button{padding:7px 10px;margin:4px 4px 4px 0;border:0;border-radius:6px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#475569}.ok{color:#166534}.bad{color:#b91c1c}.info{color:#1d4ed8}#details{margin-top:6px;padding:6px;background:#fff;border:1px solid #cbd5e1;border-radius:5px;max-height:150px;overflow:auto;white-space:pre-wrap;font-family:Consolas,monospace;font-size:11px}#map{flex:1}.leaflet-control-layers{font-size:12px}</style></head><body><div id="top"><b>Tester ortofotomapy – WMTS</b><br>Tester pobiera rzeczywiste <b>GetCapabilities</b> Geoportalu i na jego podstawie pokazuje konfigurację WMTS. Następnie porównuje różne warianty adresu kafelka.<br><button onclick="loadCapabilities()">1. Pobierz GetCapabilities</button><button class="secondary" onclick="runTileTests()">2. Testuj kafelki</button><span id="status" class="info">Najpierw pobierz GetCapabilities.</span><div id="details">Brak danych.</div></div><div id="map"></div><script>const WMTS='https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMTS/StandardResolution';const CAP=WMTS+'?SERVICE=WMTS&REQUEST=GetCapabilities';let cap=null,variants={},testLayers=[];const map=L.map('map',{maxZoom:22}).setView([53.63,21.81],13);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,attribution:'© OpenStreetMap'}).addTo(map);const control=L.control.layers({'OpenStreetMap':osm},{},{collapsed:false}).addTo(map);function txt(el){return el?el.textContent.trim():''}function localName(el){return el?el.localName||el.nodeName.split(':').pop():''}function children(el,name){return Array.from(el.children||[]).filter(x=>localName(x)===name)}function descendants(root,name){return Array.from(root.getElementsByTagName('*')).filter(x=>localName(x)===name)}async function loadCapabilities(){const s=document.getElementById('status'),d=document.getElementById('details');s.textContent='Pobieram GetCapabilities…';s.className='info';d.textContent='';try{const r=await fetch(CAP,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const xml=await r.text();if(!xml.includes('<')||!xml.toLowerCase().includes('capabilities'))throw new Error('Odpowiedź nie wygląda na XML WMTS');const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))throw new Error('Nie udało się sparsować XML');cap=doc;const layers=descendants(doc,'Layer');const matrixSets=descendants(doc,'TileMatrixSet');const ortho=layers.find(x=>txt(children(x,'Identifier')[0])==='ORTOFOTOMAPA')||layers[0];const orthoId=ortho?txt(children(ortho,'Identifier')[0]):'';const links=ortho?descendants(ortho,'TileMatrixSetLink'):[];const linked=links.map(x=>txt(descendants(x,'TileMatrixSet')[0])).filter(Boolean);let rows=[];for(const ms of matrixSets){const id=txt(children(ms,'Identifier')[0]);const crs=txt(children(ms,'SupportedCRS')[0]);const matrices=children(ms,'TileMatrix');rows.push(id+' | CRS='+crs+' | macierze='+matrices.length+(matrices.length?' | pierwsza='+txt(children(matrices[0],'Identifier')[0]||''):'')+(matrices.length?' | ostatnia='+txt(children(matrices[matrices.length-1],'Identifier')[0]||''):''));}let resourceUrls=ortho?descendants(ortho,'ResourceURL').map(x=>x.getAttribute('template')||'').filter(Boolean):[];d.textContent='Warstwa: '+orthoId+'\nPowiązane TileMatrixSet: '+(linked.join(', ')||'(brak)')+'\n\nTileMatrixSet:\n'+(rows.join('\n')||'(brak)')+'\n\nResourceURL:\n'+(resourceUrls.join('\n')||'(brak)');const chosen=linked.find(id=>id==='EPSG:3857')||linked.find(id=>id.toUpperCase().includes('3857'))||linked[0]||'EPSG:3857';const ms=matrixSets.find(x=>txt(children(x,'Identifier')[0])===chosen)||matrixSets[0];const mids=ms?children(ms,'TileMatrix').map(x=>txt(children(x,'Identifier')[0])):[];const first=mids[0]||'';const last=mids[mids.length-1]||'';const template=resourceUrls[0]||'';variants={chosen,first,last,template,orthoId,mids};s.textContent='GetCapabilities OK. Wybrano TileMatrixSet: '+chosen+' | zakres: '+first+' … '+last;s.className='ok';runTileTests()}catch(e){cap=null;variants={};s.textContent='BŁĄD GetCapabilities: '+e.message;s.className='bad';d.textContent='Jeżeli przeglądarka blokuje CORS, tester pokaże to tutaj. W takim przypadku nie zmieniamy jeszcze aplikacji.'}}function buildUrl(kind,z,x,y){const v=variants;const base=WMTS+'?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER='+encodeURIComponent(v.orthoId||'ORTOFOTOMAPA')+'&STYLE=default&TILEMATRIXSET='+encodeURIComponent(v.chosen||'EPSG:3857')+'&FORMAT=image/jpeg';if(kind==='matrix')return base+'&TILEMATRIX='+encodeURIComponent((v.mids&&v.mids[z])||((v.chosen||'EPSG:3857')+':'+z))+'&TILEROW='+y+'&TILECOL='+x;if(kind==='numeric')return base+'&TILEMATRIX='+z+'&TILEROW='+y+'&TILECOL='+x;return base+'&TILEMATRIX='+encodeURIComponent((v.chosen||'EPSG:3857')+':'+z)+'&TILEROW='+y+'&TILECOL='+x}function addVariant(name,url){const layer=L.tileLayer(url,{minZoom:5,maxZoom:22,maxNativeZoom:20,updateWhenZooming:false,updateWhenIdle:true,keepBuffer:1,attribution:'GUGiK Geoportal'});let started=0,loaded=0,errors=0,first=0;layer.on('tileloadstart',()=>{started++});layer.on('tileload',()=>{loaded++;if(!first)first=Math.round(performance.now())});layer.on('tileerror',e=>{errors++;if(errors<=2)console.warn(name,e)});layer._diag={name,get:()=>({started,loaded,errors})};control.addOverlay(layer,name);testLayers.push(layer)}function runTileTests(){if(!variants.chosen){document.getElementById('status').textContent='Najpierw pobierz GetCapabilities.';return}testLayers.forEach(l=>{if(l._map)map.removeLayer(l)});testLayers=[];const z=map.getZoom(),p=map.getCenter(),pt=map.project(p,z),x=Math.floor(pt.x/256),y=Math.floor(pt.y/256);const u1=buildUrl('matrix',z,x,y),u2=buildUrl('template',z,x,y),u3=buildUrl('numeric',z,x,y);addVariant('WMTS – matrix z GetCapabilities',u1);addVariant('WMTS – EPSG:3857:z',u2);addVariant('WMTS – numer z (diagnostyczny)',u3);const d=document.getElementById('details');d.textContent+='\n\nTestowy poziom z='+z+', x='+x+', y='+y+'\n\nURL wariant 1:\n'+u1+'\n\nURL wariant 2:\n'+u2+'\n\nURL wariant 3:\n'+u3+'\n\nWłącz w panelu warstw jeden wariant naraz i powiększ mapę. Tester nie zmienia głównej aplikacji.';document.getElementById('status').textContent='Dodano 3 warianty WMTS. Testuj je pojedynczo z panelu warstw.';document.getElementById('status').className='info'}map.on('zoomend moveend',()=>{if(variants.chosen)document.getElementById('status').textContent='Mapa przesunięta/przybliżona. Możesz porównać warianty ponownie.'});</script></body></html>
