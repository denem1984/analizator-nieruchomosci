<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostyka ortofotomapy – WMS vs WMTS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{height:100%;margin:0;font-family:Arial,sans-serif}body{display:flex;flex-direction:column}#top{padding:10px;background:#f1f5f9;border-bottom:1px solid #cbd5e1;font-size:13px}button{padding:8px 12px;margin-right:6px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.ok{color:#166534}.info{color:#1d4ed8}#map{flex:1}.leaflet-control-layers{font-size:12px}</style></head><body><div id="top"><b>Tester ortofotomapy</b> — porównanie aktualnego WMS z przygotowanym WMTS Geoportalu. <span id="status" class="info">Wybierz warstwę i przybliż mapę do Olsztyna/Pisza.</span><br><button onclick="startTest()">Uruchom test ładowania</button><span id="timer"></span></div><div id="map"></div><script>const map=L.map('map',{maxZoom:22}).setView([53.63,21.81],12);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,attribution:'© OpenStreetMap'}).addTo(map);const wms=L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution',{layers:'Raster',format:'image/jpeg',maxZoom:22,updateWhenZooming:false,updateWhenIdle:true,keepBuffer:1});const wmts=L.tileLayer('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMTS/StandardResolution?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTOFOTOMAPA&STYLE=default&TILEMATRIXSET=EPSG:3857&TILEMATRIX=EPSG:3857:{z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg',{minZoom:5,maxZoom:22,maxNativeZoom:20,updateWhenZooming:false,updateWhenIdle:true,keepBuffer:2,attribution:'GUGiK Geoportal'});L.control.layers({'OpenStreetMap':osm},{'ORTO WMS':wms,'ORTO WMTS':wmts},{collapsed:false}).addTo(map);function startTest(){const active=wms._map?'WMS':wmts._map?'WMTS':'brak';if(active==='brak'){status.textContent='Najpierw włącz WMS albo WMTS.';status.className='info';return}let t=performance.now(),loaded=0,started=0;const layer=active==='WMS'?wms:wmts;const onload=()=>{loaded++;if(loaded===1){document.getElementById('timer').textContent=' — pierwszy kafel: '+Math.round(performance.now()-t)+' ms';status.textContent=active+' zaczął odpowiadać.';status.className='ok'}};layer.on('tileloadstart',()=>started++);layer.on('tileload',onload);setTimeout(()=>{status.textContent=active+': po 5 s załadowano '+loaded+' kafli z '+started+' rozpoczętych.';status.className=loaded?'ok':'info';},5000)}</script></body></html>
