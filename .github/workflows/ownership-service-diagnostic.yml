name: Ownership WMS diagnostic

on:
  push:
    paths:
      - '.github/workflows/ownership-service-diagnostic.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test global ownership services
        shell: bash
        run: |
          set +e
          : > ownership-diagnostic.txt
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ownership-diagnostic.txt

          test_caps() {
            name="$1"
            url="$2"
            out="/tmp/${name}.xml"
            curl -L --max-time 60 -sS -o "$out" "$url"
            rc=$?
            echo "===== $name CAPABILITIES =====" >> ownership-diagnostic.txt
            echo "curl_exit=$rc" >> ownership-diagnostic.txt
            echo "size=$(wc -c < "$out" 2>/dev/null)" >> ownership-diagnostic.txt
            echo "content_type=$(file -b "$out" 2>/dev/null)" >> ownership-diagnostic.txt
            if [ -s "$out" ]; then
              echo "layers:" >> ownership-diagnostic.txt
              python3 - "$out" <<'PY' >> ownership-diagnostic.txt
import sys, xml.etree.ElementTree as ET
p=sys.argv[1]
try:
    root=ET.parse(p).getroot()
    for e in root.iter():
        if e.tag.split('}')[-1]=='Layer':
            n=next((x.text for x in list(e) if x.tag.split('}')[-1]=='Name'),None)
            t=next((x.text for x in list(e) if x.tag.split('}')[-1]=='Title'),None)
            if n: print(f"{n} | {t or ''}")
except Exception as ex: print('XML_PARSE_ERROR',repr(ex))
PY
            fi
          }

          test_map() {
            name="$1"
            base="$2"
            layer="$3"
            out="/tmp/${name}.png"
            url="${base}?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=${layer}&STYLES=&SRS=EPSG:4326&BBOX=13.2,48.4,25.4,55.4&WIDTH=1200&HEIGHT=800&FORMAT=image/png&TRANSPARENT=TRUE"
            curl -L --max-time 90 -sS -D "/tmp/${name}.headers" -o "$out" "$url"
            rc=$?
            echo "===== $name GETMAP =====" >> ownership-diagnostic.txt
            echo "curl_exit=$rc" >> ownership-diagnostic.txt
            echo "$(sed -n '1,12p' "/tmp/${name}.headers" 2>/dev/null | tr '\n' ' ')" >> ownership-diagnostic.txt
            echo "size=$(wc -c < "$out" 2>/dev/null)" >> ownership-diagnostic.txt
            echo "file=$(file -b "$out" 2>/dev/null)" >> ownership-diagnostic.txt
          }

          GUGIK='https://mapy.geoportal.gov.pl/wss/ext/MapaWlasnosci'
          EPOD='https://wms16.epodgik.pl/cgi-bin/Wlasnosc'
          test_caps GUGIK "$GUGIK?SERVICE=WMS&REQUEST=GetCapabilities"
          test_caps EPODGIK "$EPOD?SERVICE=WMS&REQUEST=GetCapabilities"
          test_map GUGIK_DZIALKI "$GUGIK" dzialki
          test_map EPODGIK_DZIALKI "$EPOD" dzialki

      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ownership-diagnostic.txt
          git commit -m "Record global ownership WMS diagnostic" || exit 0
          git push
