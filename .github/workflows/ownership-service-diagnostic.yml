name: Ownership WMS diagnostic

on:
  push:
    paths:
      - '.github/workflows/ownership-service-diagnostic.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test global ownership services
        shell: bash
        run: |
          set +e
          : > ownership-diagnostic-summary.txt
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ownership-diagnostic-summary.txt

          for spec in \
            "GUGIK|https://mapy.geoportal.gov.pl/wss/ext/MapaWlasnosci" \
            "EPODGIK|https://wms16.epodgik.pl/cgi-bin/Wlasnosc"; do
            name="${spec%%|*}"
            base="${spec#*|}"
            cap="/tmp/${name}.xml"
            hdr="/tmp/${name}.hdr"
            curl -L --max-time 60 -sS -D "$hdr" -o "$cap" "$base?SERVICE=WMS&REQUEST=GetCapabilities"
            rc=$?
            echo "===== $name CAPABILITIES =====" >> ownership-diagnostic-summary.txt
            echo "curl_exit=$rc" >> ownership-diagnostic-summary.txt
            echo "$(grep -Ei '^(HTTP/|content-type:|content-length:)' "$hdr" | tr '\n' ' ')" >> ownership-diagnostic-summary.txt
            echo "size=$(wc -c < "$cap" 2>/dev/null)" >> ownership-diagnostic-summary.txt
            echo "layers:" >> ownership-diagnostic-summary.txt
            grep -oE '<(Name|Title)>[^<]+' "$cap" 2>/dev/null | sed 's/<Name>/NAME: /;s/<Title>/TITLE: /' | head -80 >> ownership-diagnostic-summary.txt

            out="/tmp/${name}.png"
            curl -L --max-time 90 -sS -D "/tmp/${name}.map.hdr" -o "$out" "$base?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=dzialki&STYLES=&SRS=EPSG:4326&BBOX=13.2,48.4,25.4,55.4&WIDTH=1200&HEIGHT=800&FORMAT=image/png&TRANSPARENT=TRUE"
            mrc=$?
            echo "===== $name GETMAP dzialki =====" >> ownership-diagnostic-summary.txt
            echo "curl_exit=$mrc" >> ownership-diagnostic-summary.txt
            echo "$(grep -Ei '^(HTTP/|content-type:|content-length:)' "/tmp/${name}.map.hdr" | tr '\n' ' ')" >> ownership-diagnostic-summary.txt
            echo "size=$(wc -c < "$out" 2>/dev/null)" >> ownership-diagnostic-summary.txt
            echo "file=$(file -b "$out" 2>/dev/null)" >> ownership-diagnostic-summary.txt
          done

      - name: Commit diagnostic summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ownership-diagnostic-summary.txt
          git commit -m "Record ownership WMS diagnostic summary" || exit 0
          git push
