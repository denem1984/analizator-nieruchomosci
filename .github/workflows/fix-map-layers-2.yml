name: Fix map layer syntax
on:
  push:
    paths:
      - '.github/workflows/fix-map-layers-2.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='if(document.getElementById("kieg").checked&&!map.hasLayer(parcelLabelsWms))map.addLayer(parcelLabelsWms)const my='
          new='if(document.getElementById("kieg").checked&&!map.hasLayer(parcelLabelsWms))map.addLayer(parcelLabelsWms);const my='
          if old not in s:
              raise SystemExit('broken loadParcelLabels syntax not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix parcel labels syntax'
          git push
