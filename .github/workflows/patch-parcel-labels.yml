name: patch-parcel-labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dynamic parcel labels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert 'layers:"dzialki,numery_dzialek"' in s, 'KIEG layer marker not found'
          assert 'map.addLayer(layers.kieg);' in s, 'KIEG init marker not found'
          s=s.replace('</style>','''.parcel-label{font-family:Arial,sans-serif;font-weight:600;color:#104e8b;white-space:nowrap;text-align:center;line-height:1;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff;pointer-events:none;transform:translate(-50%,-50%);will-change:font-size}.parcel-label-pane{z-index:450!important}\n</style>''',1)
          s=s.replace('layers:"dzialki,numery_dzialek"','layers:"dzialki"',1)
          code=r'''const parcelWfs="https://mapy.geoportal.gov.pl/wss/service/PZGIK/EGIB/WFS/UslugaZbiorcza",parcelLabelPane="parcelLabelsPane";map.createPane(parcelLabelPane);map.getPane(parcelLabelPane).style.zIndex=450;map.getPane(parcelLabelPane).classList.add("parcel-label-pane");const parcelLabels=L.layerGroup(),parcelLabelsWms=L.tileLayer.wms(E,{pane:parcelLabelPane,layers:"numery_dzialek",format:"image/png",transparent:true,opacity:.95,maxZoom:22,updateWhenZooming:false,updateWhenIdle:true,keepBuffer:1});let parcelLabelTimer=null,parcelLabelRequest=0,parcelLabelsLoaded=false;function clearParcelLabels(){parcelLabels.clearLayers();parcelLabelsLoaded=false}function parcelFontSize(){const z=map.getZoom();return Math.max(10,Math.min(15,10+(z-13)*.72))}function ringCentroid(a){let A=0,cx=0,cy=0;for(let i=0,j=a.length-1;i<a.length;j=i++){const x0=a[j][0],y0=a[j][1],x1=a[i][0],y1=a[i][1],cr=x0*y1-x1*y0;A+=cr;cx+=(x0+x1)*cr;cy+=(y0+y1)*cr}if(Math.abs(A)<1e-9)return null;return[cx/(3*A),cy/(3*A)]}function featurePoint(g){if(!g)return null;if(g.type==="Point")return g.coordinates;if(g.type==="Polygon"){const c=ringCentroid(g.coordinates[0]);return c||g.coordinates[0][0]}if(g.type==="MultiPolygon"){let best=null,area=-1;for(const poly of g.coordinates){const r=poly[0];let a=0;for(let i=1;i<r.length;i++)a+=Math.abs((r[i-1][0]*r[i][1]-r[i][0]*r[i-1][1]));if(a>area){area=a;best=ringCentroid(r)||r[0]}}return best}return null}function makeParcelLabel(id,ll){const icon=L.divIcon({className:"parcel-label",html:`<span>${String(id).replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}</span>`,iconSize:[1,1],iconAnchor:[0,0]});return L.marker(ll,{icon,interactive:false,keyboard:false,pane:parcelLabelPane})}function labelBoxesOverlap(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom)}function renderParcelLabels(features){parcelLabels.clearLayers();const size=parcelFontSize(),accepted=[];for(const f of features){const id=f?.properties?.id_dzialki||f?.properties?.idDzialki||f?.properties?.NUMER_DZIALKI||f?.properties?.numer_dzialki;if(!id)continue;const pt=featurePoint(f.geometry);if(!pt||!Number.isFinite(pt[0])||!Number.isFinite(pt[1]))continue;const ll=L.latLng(pt[1],pt[0]),px=map.latLngToLayerPoint(ll),text=String(id).split(".").pop(),w=Math.max(18,text.length*size*.62),h=size+4,box={left:px.x-w/2-3,right:px.x+w/2+3,top:px.y-h/2-3,bottom:px.y+h/2+3};if(accepted.some(x=>labelBoxesOverlap(box,x)))continue;accepted.push(box);parcelLabels.addLayer(makeParcelLabel(text,ll))}parcelLabels.eachLayer(m=>m.getElement()?.style.setProperty("font-size",size+"px"));if(!map.hasLayer(parcelLabels))map.addLayer(parcelLabels);parcelLabelsLoaded=true}async function loadParcelLabels(){if(!document.getElementById("kieg").checked||map.getZoom()<13){clearParcelLabels();if(map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms);return}const my=++parcelLabelRequest,b=map.getBounds(),pad=.12,latSpan=b.getNorth()-b.getSouth(),lonSpan=b.getEast()-b.getWest(),south=Math.max(-90,b.getSouth()-latSpan*pad),north=Math.min(90,b.getNorth()+latSpan*pad),west=b.getWest()-lonSpan*pad,east=b.getEast()+lonSpan*pad,u=new URL(parcelWfs),q={service:"WFS",version:"2.0.0",request:"GetFeature",typenames:"ms:dzialki",bbox:`${south},${west},${north},${east},EPSG:4326`,srsName:"EPSG:4326",outputFormat:"application/json",count:"2000",propertyName:"id_dzialki,geom"};Object.entries(q).forEach(([k,v])=>u.searchParams.set(k,v));try{const res=await fetch(u,{headers:{Accept:"application/json"}});if(!res.ok)throw Error("HTTP "+res.status);const text=await res.text();if(my!==parcelLabelRequest)return;let data;try{data=JSON.parse(text)}catch{throw Error("WFS nie zwrócił GeoJSON")}const fs=(data.features||[]).filter(f=>f&&f.geometry);if(!fs.length)throw Error("Brak działek w widoku");if(my!==parcelLabelRequest)return;if(map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms);renderParcelLabels(fs)}catch(e){console.warn("Dynamiczne etykiety działek:",e);if(my===parcelLabelRequest){clearParcelLabels();if(!map.hasLayer(parcelLabelsWms))map.addLayer(parcelLabelsWms)}}}function scheduleParcelLabels(){clearTimeout(parcelLabelTimer);parcelLabelTimer=setTimeout(loadParcelLabels,180)}document.getElementById("kieg").addEventListener("change",e=>{if(e.target.checked)scheduleParcelLabels();else{clearParcelLabels();if(map.hasLayer(parcelLabelsWms))map.removeLayer(parcelLabelsWms)}});map.on("zoomend moveend",scheduleParcelLabels);map.on("zoom",()=>{if(parcelLabelsLoaded){const size=parcelFontSize();parcelLabels.eachLayer(m=>m.getElement()?.style.setProperty("font-size",size+"px"))}});scheduleParcelLabels();'''
          s=s.replace('map.addLayer(layers.kieg);', 'map.addLayer(layers.kieg);'+code,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'layers:"dzialki"' index.html
          grep -q 'ms:dzialki' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve dynamic parcel number visibility'
          rm -f .github/workflows/patch-parcel-labels.yml
          git add .github/workflows/patch-parcel-labels.yml
          git commit -m 'Remove temporary patch workflow'
          git push
