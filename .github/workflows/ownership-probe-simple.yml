name: Ownership probe simple
on:
  push:
    paths:
      - '.github/workflows/ownership-probe-simple.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: bash
        run: |
          set +e
          : > ownership-live-result.txt
          echo "DATE=$(date -u +%FT%TZ)" >> ownership-live-result.txt
          echo "GUGIK CAPABILITIES" >> ownership-live-result.txt
          curl -L --max-time 60 -sS 'https://mapy.geoportal.gov.pl/wss/ext/MapaWlasnosci?SERVICE=WMS&REQUEST=GetCapabilities' -o /tmp/g.xml
          echo "http=$(curl -L --max-time 60 -sS -o /dev/null -w '%{http_code}' 'https://mapy.geoportal.gov.pl/wss/ext/MapaWlasnosci?SERVICE=WMS&REQUEST=GetCapabilities')" >> ownership-live-result.txt
          grep -oE '<Name>[^<]+' /tmp/g.xml | head -30 >> ownership-live-result.txt
          echo "GUGIK GETMAP 4326" >> ownership-live-result.txt
          curl -L --max-time 90 -sS -D /tmp/g.h -o /tmp/g.png 'https://mapy.geoportal.gov.pl/wss/ext/MapaWlasnosci?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=dzialki&STYLES=&SRS=EPSG:4326&BBOX=21.70,53.50,21.90,53.70&WIDTH=800&HEIGHT=600&FORMAT=image/png&TRANSPARENT=TRUE'
          grep -Ei '^(HTTP/|content-type:|content-length:)' /tmp/g.h >> ownership-live-result.txt
          file /tmp/g.png >> ownership-live-result.txt
          identify /tmp/g.png >> ownership-live-result.txt 2>&1
          convert /tmp/g.png -format '%c' histogram:info:- 2>/dev/null | sort -nr | head -15 >> ownership-live-result.txt
          echo "EPOD CAPABILITIES" >> ownership-live-result.txt
          curl -L --max-time 60 -sS 'https://wms16.epodgik.pl/cgi-bin/Wlasnosc?SERVICE=WMS&REQUEST=GetCapabilities' -o /tmp/e.xml
          echo "http=$(curl -L --max-time 60 -sS -o /dev/null -w '%{http_code}' 'https://wms16.epodgik.pl/cgi-bin/Wlasnosc?SERVICE=WMS&REQUEST=GetCapabilities')" >> ownership-live-result.txt
          grep -oE '<Name>[^<]+' /tmp/e.xml | head -30 >> ownership-live-result.txt
          echo "EPOD GETMAP grupy 4326" >> ownership-live-result.txt
          curl -L --max-time 90 -sS -D /tmp/e.h -o /tmp/e.png 'https://wms16.epodgik.pl/cgi-bin/Wlasnosc?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=grupy&STYLES=&SRS=EPSG:4326&BBOX=21.70,53.50,21.90,53.70&WIDTH=800&HEIGHT=600&FORMAT=image/png&TRANSPARENT=TRUE'
          grep -Ei '^(HTTP/|content-type:|content-length:)' /tmp/e.h >> ownership-live-result.txt
          file /tmp/e.png >> ownership-live-result.txt
          identify /tmp/e.png >> ownership-live-result.txt 2>&1
          convert /tmp/e.png -format '%c' histogram:info:- 2>/dev/null | sort -nr | head -15 >> ownership-live-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ownership-live-result.txt
          git commit -m 'Record ownership WMS live probe' || true
          git push
