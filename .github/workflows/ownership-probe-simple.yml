name: Ownership probe simple
on:
  push:
    paths:
      - '.github/workflows/ownership-probe-simple.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact Leaflet WMS request
        shell: bash
        run: |
          set +e
          : > ownership-live-result.txt
          URL='https://mapy.geoportal.gov.pl/wss/ext/MapaWlasnosci?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=dzialki&STYLES=&SRS=EPSG:3857&BBOX=2410000,7030000,2440000,7060000&WIDTH=800&HEIGHT=600&FORMAT=image/png&TRANSPARENT=TRUE'
          curl -L --max-time 90 -sS -D /tmp/h -o /tmp/x.png "$URL"
          echo "HTTP=$(grep -m1 '^HTTP/' /tmp/h)" >> ownership-live-result.txt
          echo "TYPE=$(grep -im1 '^content-type:' /tmp/h)" >> ownership-live-result.txt
          echo "SIZE=$(wc -c < /tmp/x.png)" >> ownership-live-result.txt
          echo "FILE=$(file -b /tmp/x.png)" >> ownership-live-result.txt
          python3 - /tmp/x.png >> ownership-live-result.txt <<'PY'
import sys,struct,zlib
from collections import Counter
p=sys.argv[1]; b=open(p,'rb').read()
print('signature',b[:8])
if b[:8]!=b'\x89PNG\r\n\x1a\n': raise SystemExit
pos=8; raw=b''
while pos<len(b):
 n=struct.unpack('>I',b[pos:pos+4])[0]; t=b[pos+4:pos+8]; d=b[pos+8:pos+8+n]; pos+=12+n
 if t==b'IHDR': w,h,bd,ct,_,_,inter=struct.unpack('>IIBBBBB',d)
 elif t==b'IDAT': raw+=d
 elif t==b'IEND': break
print('PNG',w,h,bd,ct,inter)
if (bd,ct,inter)!=(8,6,0): raise SystemExit
D=zlib.decompress(raw); stride=w*4; prev=bytearray(stride); off=0; c=Counter(); alpha=Counter()
for y in range(h):
 f=D[off]; off+=1; cur=bytearray(D[off:off+stride]); off+=stride
 for i in range(stride):
  a=cur[i-4] if i>=4 else 0; u=prev[i]; ul=prev[i-4] if i>=4 else 0
  if f==1: cur[i]=(cur[i]+a)&255
  elif f==2: cur[i]=(cur[i]+u)&255
  elif f==3: cur[i]=(cur[i]+((a+u)//2))&255
  elif f==4:
   q=a+u-ul; pa=abs(q-a); pb=abs(q-u); pc=abs(q-ul); pr=a if pa<=pb and pa<=pc else (u if pb<=pc else ul); cur[i]=(cur[i]+pr)&255
 for i in range(0,stride,4):
  q=tuple(cur[i:i+4]); alpha[q[3]]+=1
  if q[3]: c[q]+=1
 prev=cur
print('alpha',alpha.most_common(10))
print('nontransparent',sum(c.values()),'of',w*h)
print('top_rgba',c.most_common(20))
PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ownership-live-result.txt
          git commit -m 'Record exact ownership WMS response' || true
          git push
