name: Oneoff group update
on:
  push:
    paths:
      - '.github/workflows/oneoff-group.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="row"><span>Powierzchnia ewidencyjna</span><b id="ra"></b></div><div class="mt-3 p-2 bg-amber-50 rounded text-xs"><b>Klasoużytki</b>'
          new='<div class="row"><span>Powierzchnia ewidencyjna</span><b id="ra"></b></div><div class="mt-3 p-2 bg-purple-50 rounded text-xs"><b>Grupa rejestrowa</b><div id="rgp">Brak danych do automatycznego pobrania</div></div><div class="mt-3 p-2 bg-amber-50 rounded text-xs"><b>Klasoużytki</b>'
          if old not in s: raise SystemExit('Nie znaleziono miejsca na kafelek grupy rejestrowej')
          s=s.replace(old,new,1)
          old='let xmlText=await res.text(),returnedId=xmlAttr(xmlText,"Identyfikator działki"),rawArea=xmlAttrPart(xmlText,"Pole pow. w ewidencji gruntów"),rawClass=xmlAttrPart(xmlText,"Oznaczenie użytku");'
          new='let xmlText=await res.text(),returnedId=xmlAttr(xmlText,"Identyfikator działki"),rawArea=xmlAttrPart(xmlText,"Pole pow. w ewidencji gruntów"),rawGroup=xmlAttrPart(xmlText,"Grupa rejestrowa"),rawClass=xmlAttrPart(xmlText,"Oznaczenie użytku");'
          if old not in s: raise SystemExit('Nie znaleziono parsera EGiB')
          s=s.replace(old,new,1)
          old='return{area:rawArea,classUse:formatClassUse(rawClass)}}function formatOfficialArea'
          new='return{area:rawArea,group:rawGroup,classUse:formatClassUse(rawClass)}}function formatOfficialArea'
          if old not in s: raise SystemExit('Nie znaleziono zwrotu danych EGiB')
          s=s.replace(old,new,1)
          old='ra.textContent=formatOfficialArea(eg.area);renderClassUses(eg.classUse);'
          new='ra.textContent=formatOfficialArea(eg.area);rgp.textContent=eg.group||"Brak danych do automatycznego pobrania";renderClassUses(eg.classUse);'
          if old not in s: raise SystemExit('Nie znaleziono renderowania raportu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes and remove oneoff workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-group.yml
          git add index.html
          git commit -m 'Dodaj grupę rejestrową do raportu'
          git push
