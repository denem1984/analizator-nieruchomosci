name: Oneoff group description update
on:
  push:
    paths:
      - '.github/workflows/oneoff-group-desc.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='ra.textContent=formatOfficialArea(eg.area);rgp.textContent=eg.group||"Brak danych do automatycznego pobrania";renderClassUses(eg.classUse);'
          new='ra.textContent=formatOfficialArea(eg.area);let gv=String(eg.group||"").trim(),gd={"1":["Skarb Państwa (bez zbiegu z uż. wieczystymi)","#ff7777","#111"],"2":["Skarb Państwa (w zbiegu z uż. wieczystymi)","#b30000","#fff"],"3":["jednoosobowe spółki SP i przedsiębiorstwa państwowe","#7f0000","#fff"],"4":["gminy, związki międzygminne (bez zbiegu z uż. wieczystymi)","#90ee90","#111"],"5":["gminy, związki międzygminne (w zbiegu z uż. wieczystymi)","#006400","#fff"],"6":["jednoosobowe spółki JST","#808000","#fff"],"7":["osoby fizyczne","#ffd92f","#111"],"8":["spółdzielnie","#ff9acb","#111"],"9":["kościoły i związki wyznaniowe","#a66cff","#fff"],"10":["wspólnoty gruntowe","#d8b4fe","#111"],"11":["powiaty i związki powiatów (bez zbiegu z uż. wieczystymi)","#87cefa","#111"],"12":["powiaty i związki powiatów (w zbiegu z uż. wieczystymi)","#0047ab","#fff"],"13":["województwa (bez zbiegu z uż. wieczystymi)","#ffb366","#111"],"14":["województwa (w zbiegu z uż. wieczystymi)","#cc6600","#fff"],"15":["spółki prawa handlowego","#6ec6ff","#111"],"16":["inne podmioty ewidencyjne","#9ca3af","#111"]}[gv];if(gd){rgp.style.backgroundColor=gd[1];rgp.style.color=gd[2];rgp.style.padding="7px 8px";rgp.style.marginTop="5px";rgp.style.borderRadius="6px";rgp.innerHTML=`<b>Grupa ${gv}</b><div style="font-size:11px;margin-top:3px">${gd[0]}</div>`}else{rgp.textContent=eg.group||"Brak danych do automatycznego pobrania"}renderClassUses(eg.classUse);'
          if old not in s: raise SystemExit('Nie znaleziono renderowania grupy rejestrowej')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-group-desc.yml
          git add index.html
          git commit -m 'Dodaj opis i kolor grupy rejestrowej'
          git push
