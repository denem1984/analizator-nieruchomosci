name: Migrate ownership WMS to API proxy
on:
  push:
    paths:
      - '.github/workflows/migrate-ownership-proxy.yml'
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch production index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='https://mapy.geoportal.gov.pl/wss/ext/MapaWlasnosci'
          new='https://analizator-nieruchomosci-api.onrender.com/api/ownership'
          if old not in s:
              raise SystemExit('OWNERSHIP_WMS_URL_NOT_FOUND')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Proxy ownership WMS through MAPA API'
          git push
