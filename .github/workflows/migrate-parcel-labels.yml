name: Migrate parcel labels to API
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const parcelWfs="https://mapy.geoportal.gov.pl/wss/service/PZGIK/EGIB/WFS/UslugaZbiorcza"'
          new='const parcelWfs="https://analizator-nieruchomosci-api.onrender.com/api/wfs"'
          if old not in s:
              raise SystemExit('parcelWfs source string not found')
          s=s.replace(old,new,1)
          s=s.replace('Math.min(15,10+(z-13)*.72)','Math.min(16,10+(z-13)*.72)',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move production parcel labels through WFS API'
          git push
