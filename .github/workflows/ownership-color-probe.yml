name: Ownership color probe

on:
  push:
    paths:
      - '.github/workflows/ownership-color-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WMS colors
        shell: bash
        run: |
          set +e
          analyze() {
            name="$1"
            url="$2"
            echo "===== $name ====="
            curl -L --max-time 90 -sS -D /tmp/h -o /tmp/x.png "$url"
            echo "curl=$?"
            grep -Ei '^(HTTP/|content-type:|content-length:)' /tmp/h || true
            file /tmp/x.png
            python3 - /tmp/x.png <<'PY'
import sys,struct,zlib
from collections import Counter
p=sys.argv[1]; b=open(p,'rb').read(); assert b[:8]==b'\x89PNG\r\n\x1a\n'; pos=8; raw=b''
while pos<len(b):
 n=struct.unpack('>I',b[pos:pos+4])[0]; t=b[pos+4:pos+8]; d=b[pos+8:pos+8+n]; pos+=12+n
 if t==b'IHDR': w,h,bd,ct,_,_,inter=struct.unpack('>IIBBBBB',d)
 elif t==b'IDAT': raw+=d
 elif t==b'IEND': break
print('PNG',w,h,'bit_depth',bd,'color_type',ct,'interlace',inter)
if bd!=8 or ct!=6 or inter!=0: print('UNSUPPORTED'); raise SystemExit
D=zlib.decompress(raw); stride=w*4; prev=bytearray(stride); off=0; c=Counter(); al=Counter()
for y in range(h):
 f=D[off]; off+=1; cur=bytearray(D[off:off+stride]); off+=stride
 for i in range(stride):
  a=cur[i-4] if i>=4 else 0; u=prev[i]; ul=prev[i-4] if i>=4 else 0
  if f==1: cur[i]=(cur[i]+a)&255
  elif f==2: cur[i]=(cur[i]+u)&255
  elif f==3: cur[i]=(cur[i]+((a+u)//2))&255
  elif f==4:
   q=a+u-ul; pa=abs(q-a); pb=abs(q-u); pc=abs(q-ul); pr=a if pa<=pb and pa<=pc else (u if pb<=pc else ul); cur[i]=(cur[i]+pr)&255
 for i in range(0,stride,4):
  rgba=tuple(cur[i:i+4]); al[rgba[3]]+=1
  if rgba[3]: c[rgba]+=1
 prev=cur
print('alpha',al.most_common(8),'nontransparent',sum(c.values()),'of',w*h)
print('top_rgba',c.most_common(20))
PY
          }
          analyze GUGIK 'https://mapy.geoportal.gov.pl/wss/ext/MapaWlasnosci?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=dzialki&STYLES=&SRS=EPSG:4326&BBOX=20.90,52.05,21.20,52.35&WIDTH=1000&HEIGHT=700&FORMAT=image/png&TRANSPARENT=TRUE'
          analyze EPODGIK 'https://wms16.epodgik.pl/cgi-bin/Wlasnosc?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=grupy&STYLES=&SRS=EPSG:4326&BBOX=20.90,52.05,21.20,52.35&WIDTH=1000&HEIGHT=700&FORMAT=image/png&TRANSPARENT=TRUE'
