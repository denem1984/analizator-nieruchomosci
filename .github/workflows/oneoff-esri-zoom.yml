name: Oneoff Esri zoom update
on:
  push:
    paths:
      - '.github/workflows/oneoff-esri-zoom.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Esri layer zoom
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{pane:"basePane",maxZoom:19,'
          new='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{pane:"basePane",maxZoom:22,maxNativeZoom:19,'
          if old not in s: raise SystemExit('Nie znaleziono konfiguracji warstwy Esri')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-esri-zoom.yml
          git add index.html
          git commit -m 'Zwiększ maksymalne powiększenie warstwy Esri'
          git push
