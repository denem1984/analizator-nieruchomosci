name: repair-dynamic-labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair parcel label pipeline
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Frontend: use ONLY our HTML labels. Do not use the KIEG numery_dzialek WMS layer.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('const parcelWfs=')
          end=s.find('scheduleParcelLabels();', start)
          assert start >= 0 and end >= 0, 'dynamic label block not found'
          end += len('scheduleParcelLabels();')
          code=r'''const parcelWfs="https://analizator-nieruchomosci-api.onrender.com/api/wfs",parcelLabelPane="parcelLabelsPane";map.createPane(parcelLabelPane);map.getPane(parcelLabelPane).style.zIndex=450;map.getPane(parcelLabelPane).classList.add("parcel-label-pane");const parcelLabels=L.layerGroup();let parcelLabelTimer=null,parcelLabelRequest=0,parcelLabelsLoaded=false;function clearParcelLabels(){parcelLabels.clearLayers();parcelLabelsLoaded=false}function parcelFontSize(){const z=map.getZoom();return Math.max(10,Math.min(18,10+(z-13)*.8))}function ringCentroid(a){let A=0,cx=0,cy=0;for(let i=0,j=a.length-1;i<a.length;j=i++){const x0=a[j][0],y0=a[j][1],x1=a[i][0],y1=a[i][1],cr=x0*y1-x1*y0;A+=cr;cx+=(x0+x1)*cr;cy+=(y0+y1)*cr}if(Math.abs(A)<1e-9)return null;return[cx/(3*A),cy/(3*A)]}function featurePoint(g){if(!g)return null;if(g.type==="Point")return g.coordinates;if(g.type==="Polygon"){const c=ringCentroid(g.coordinates[0]);return c||g.coordinates[0][0]}if(g.type==="MultiPolygon"){let best=null,area=-1;for(const poly of g.coordinates){const r=poly[0];let a=0;for(let i=1;i<r.length;i++)a+=Math.abs(r[i-1][0]*r[i][1]-r[i][0]*r[i-1][1]);if(a>area){area=a;best=ringCentroid(r)||r[0]}}return best}return null}function makeParcelLabel(id,ll){const icon=L.divIcon({className:"parcel-label",html:`<span>${String(id).replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}</span>`,iconSize:[1,1],iconAnchor:[0,0]});return L.marker(ll,{icon,interactive:false,keyboard:false,pane:parcelLabelPane})}function labelBoxesOverlap(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom)}function renderParcelLabels(features){parcelLabels.clearLayers();const size=parcelFontSize(),accepted=[];for(const f of features){const id=f?.properties?.id_dzialki||f?.properties?.idDzialki||f?.properties?.NUMER_DZIALKI||f?.properties?.numer_dzialki;if(!id)continue;const pt=featurePoint(f.geometry);if(!pt||!Number.isFinite(pt[0])||!Number.isFinite(pt[1]))continue;const ll=L.latLng(pt[1],pt[0]),px=map.latLngToLayerPoint(ll),text=String(id).split(".").pop(),w=Math.max(18,text.length*size*.62),h=size+4,box={left:px.x-w/2-3,right:px.x+w/2+3,top:px.y-h/2-3,bottom:px.y+h/2+3};if(accepted.some(x=>labelBoxesOverlap(box,x)))continue;accepted.push(box);parcelLabels.addLayer(makeParcelLabel(text,ll))}parcelLabels.eachLayer(m=>m.getElement()?.style.setProperty("font-size",size+"px"));if(!map.hasLayer(parcelLabels))map.addLayer(parcelLabels);parcelLabelsLoaded=true}async function loadParcelLabels(){if(!document.getElementById("kieg").checked||map.getZoom()<13){clearParcelLabels();return}const my=++parcelLabelRequest,b=map.getBounds(),pad=.15,latSpan=b.getNorth()-b.getSouth(),lonSpan=b.getEast()-b.getWest(),south=Math.max(-90,b.getSouth()-latSpan*pad),north=Math.min(90,b.getNorth()+latSpan*pad),west=b.getWest()-lonSpan*pad,east=b.getEast()+lonSpan*pad,u=new URL(parcelWfs);u.searchParams.set("bbox",`${south},${west},${north},${east}`);try{const res=await fetch(u,{headers:{Accept:"application/json"}});if(!res.ok)throw Error("HTTP "+res.status);const data=await res.json();if(my!==parcelLabelRequest)return;const fs=(data.features||[]).filter(f=>f&&f.geometry);if(fs.length)renderParcelLabels(fs);else clearParcelLabels()}catch(e){console.warn("Dynamiczne etykiety działek:",e);if(my===parcelLabelRequest)clearParcelLabels()}}function scheduleParcelLabels(){clearTimeout(parcelLabelTimer);parcelLabelTimer=setTimeout(loadParcelLabels,180)}document.getElementById("kieg").addEventListener("change",e=>{if(e.target.checked)scheduleParcelLabels();else clearParcelLabels()});map.on("zoomend moveend",scheduleParcelLabels);map.on("zoom",()=>{if(parcelLabelsLoaded){const size=parcelFontSize();parcelLabels.eachLayer(m=>m.getElement()?.style.setProperty("font-size",size+"px"))}});scheduleParcelLabels();'''
          s=s[:start]+code+s[end:]
          p.write_text(s,encoding='utf-8')

          # API: query the official national WFS with a standard EPSG:2180 BBOX.
          p=Path('api-dzialki/server.js')
          s=p.read_text(encoding='utf-8')
          a=s.find('async function wfs(')
          b=s.find('\nfunction q(',a)
          assert a>=0 and b>=0, 'wfs function markers not found'
          fn=r'''async function wfs(reqUrl,res){const u=new URL(reqUrl,'http://localhost');const b=bbox2180(u.searchParams.get('bbox'));if(!b)return send(res,400,'application/json; charset=utf-8',JSON.stringify({error:'Nieprawidłowy bbox EPSG:4326.'}));const bbox=`${b.minX.toFixed(2)},${b.minY.toFixed(2)},${b.maxX.toFixed(2)},${b.maxY.toFixed(2)},EPSG:2180`;console.log('WFS_BBOX_2180',JSON.stringify({bbox,minX:b.minX,maxX:b.maxX,minY:b.minY,maxY:b.maxY,axisOrder:'X Y'}));const target=new URL(WFS);for(const[k,v]of Object.entries({service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'dzialki',srsName:'EPSG:2180',bbox,count:'1000',propertyName:'id_dzialki,geom',outputFormat:'application/json'}))target.searchParams.set(k,v);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);try{const r=await fetch(target.href,{signal:controller.signal,headers:{'User-Agent':'MAPA production parcel labels/3.0','Accept':'application/json,text/json,application/xml,text/xml,*/*'}});const text=await r.text();clearTimeout(timer);const ct=(r.headers.get('content-type')||'').toLowerCase();console.log('WFS_RESPONSE',JSON.stringify({status:r.status,contentType:ct,bytes:text.length,preview:text.slice(0,180)}));if(ct.includes('json')){try{const data=normalizeJsonGeoJson(JSON.parse(text));if(data)return send(res,r.status,'application/json; charset=utf-8',JSON.stringify(data))}catch(e){console.error('WFS_JSON_PARSE_ERROR',e.message)}return send(res,502,'application/json; charset=utf-8',JSON.stringify({error:'Nie udało się odczytać odpowiedzi JSON WFS.',status:r.status,preview:text.slice(0,500)}))}if(r.ok&&/<(?:wfs:)?FeatureCollection\b/i.test(text)){const data=parseGml(text);console.log('WFS_GML_PARSED',JSON.stringify({features:data.features.length,sampleId:data.features[0]?.properties?.id_dzialki||null,sampleGeometry:data.features[0]?.geometry?.type||null,sampleCoordinate:data.features[0]?.geometry?.coordinates?.[0]?.[0]||null}));return send(res,200,'application/json; charset=utf-8',JSON.stringify(data))}return send(res,502,'application/json; charset=utf-8',JSON.stringify({error:'WFS nie zwrócił danych GeoJSON/GML.',status:r.status,contentType:ct,preview:text.slice(0,500)}))}catch(e){clearTimeout(timer);return send(res,502,'application/json; charset=utf-8',JSON.stringify({error:e.name==='AbortError'?'GUGiK WFS przekroczył limit 60 s.':e.message}))}}'''
          s=s[:a]+fn+s[b:]
          p.write_text(s,encoding='utf-8')
          PY

          # Remove the temporary workflow in the same commit.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api-dzialki/server.js
          git commit -m 'Restore real dynamic parcel labels and fix WFS query'
          rm -f .github/workflows/repair-dynamic-labels.yml
          git add .github/workflows/repair-dynamic-labels.yml
          git commit -m 'Remove temporary parcel label repair workflow'
          git push