<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostyka obrębów – GUGiK</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:20px auto;padding:0 16px;background:#f8fafc;color:#172033}button{padding:10px 14px;margin:4px;border:0;border-radius:7px;background:#2563eb;color:#fff;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;padding:14px;border-radius:8px;max-height:420px;overflow:auto}.ok{color:#166534}.err{color:#991b1b}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:6px;text-align:left}</style></head><body><h1>Diagnostyka obrębów – GUGiK</h1><p>Testujemy rzeczywiste źródła danych dla gminy <b>Pisz (281603_3)</b>. Tester nie zmienia aplikacji głównej.</p><button onclick="runAll()">▶ Uruchom wszystkie testy</button><button onclick="testWfs()">WFS PRG – filtr A06</button><button onclick="testWfsBbox()">WFS PRG – BBOX</button><button onclick="testUldk()">ULDK – znane obręby</button><div id="out"></div><script>const W='https://mapy.geoportal.gov.pl/wss/service/PZGIK/PRG/WFS/AdministrativeBoundaries',U='https://uldk.gugik.gov.pl/';function card(title,status,body){out.innerHTML+=`<div class="card"><h2>${title}</h2><div class="${status?'ok':'err'}">${status?'OK':'BŁĄD'}</div>${body}</div>`}async function req(url){let t=Date.now(),r=await fetch(url);let text=await r.text();return{r,text,ms:Date.now()-t}}function parse(text){let xml=new DOMParser().parseFromString(text,'text/xml');let err=xml.getElementsByTagName('parsererror').length;let members=[...xml.getElementsByTagNameNS('*','member'),...xml.getElementsByTagNameNS('*','featureMember')];let rows=members.map(m=>{let es=[...m.getElementsByTagName('*')];let c=es.find(e=>e.localName==='JPT_KOD_JE'),n=es.find(e=>e.localName==='JPT_NAZWA_');return c&&n?{code:c.textContent.trim(),name:n.textContent.trim()}:null}).filter(Boolean);return{err,members:members.length,rows:[...new Map(rows.map(x=>[x.code,x])).values()]}}async function testWfs(){let p=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ms:A06_Granice_obrebow_ewidencyjnych',propertyName:'JPT_KOD_JE,JPT_NAZWA_',count:'1000',outputFormat:'GML3',filter:'<fes:Filter xmlns:fes="http://www.opengis.net/fes/2.0"><fes:Or><fes:PropertyIsLike wildCard="*" singleChar="?" escape="\\"><fes:ValueReference>JPT_KOD_JE</fes:ValueReference><fes:Literal>281603_4.*</fes:Literal></fes:PropertyIsLike><fes:PropertyIsLike wildCard="*" singleChar="?" escape="\\"><fes:ValueReference>JPT_KOD_JE</fes:ValueReference><fes:Literal>281603_5.*</fes:Literal></fes:PropertyIsLike></fes:Or></fes:Filter>'});try{let x=await req(W+'?'+p);let a=parse(x.text);card('WFS PRG – filtr A06',x.r.ok,a.err?`<p>HTTP ${x.r.status}, czas ${x.ms} ms. XML parser error.</p><pre>${esc(x.text.slice(0,5000))}</pre>`:`<p>HTTP ${x.r.status}, czas ${x.ms} ms. elementów member/featureMember: ${a.members}. Rozpoznanych obrębów: <b>${a.rows.length}</b></p>${rows(a.rows)}<details><summary>Odpowiedź serwera</summary><pre>${esc(x.text.slice(0,8000))}</pre></details>`)}catch(e){card('WFS PRG – filtr A06',false,`<p>FETCH ERROR: ${esc(e.message)}</p>`)} }async function testWfsBbox(){let p=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ms:A06_Granice_obrebow_ewidencyjnych',srsName:'EPSG:4326',bbox:'53.4,21.5,54.0,22.2,urn:ogc:def:crs:EPSG::4326',count:'1000',outputFormat:'GML3'});try{let x=await req(W+'?'+p);let a=parse(x.text);card('WFS PRG – BBOX Pisz',x.r.ok,a.err?`<p>HTTP ${x.r.status}, XML parser error.</p><pre>${esc(x.text.slice(0,5000))}</pre>`:`<p>HTTP ${x.r.status}, czas ${x.ms} ms. member/featureMember: ${a.members}. Wszystkie obręby w BBOX: <b>${a.rows.length}</b></p>${rows(a.rows)}<details><summary>Odpowiedź serwera</summary><pre>${esc(x.text.slice(0,8000))}</pre></details>`)}catch(e){card('WFS PRG – BBOX Pisz',false,`<p>FETCH ERROR: ${esc(e.message)}</p>`)} }async function testUldk(){let ids=['281603_4.0001','281603_4.0002','281603_5.0001'];let html='<table><tr><th>ID obrębu</th><th>HTTP</th><th>Odpowiedź</th></tr>';let ok=true;for(let id of ids){try{let u=new URL(U);u.searchParams.set('request','GetRegionById');u.searchParams.set('id',id);u.searchParams.set('result','id,teryt,region');let x=await req(u);let good=x.r.ok&&!/^0\s*$/.test(x.text.trim());if(!good)ok=false;html+=`<tr><td>${id}</td><td>${x.r.status}</td><td><pre>${esc(x.text.slice(0,1000))}</pre></td></tr>`}catch(e){ok=false;html+=`<tr><td>${id}</td><td>FETCH ERROR</td><td>${esc(e.message)}</td></tr>`}}html+='</table>';card('ULDK – znane obręby',ok,html)}function rows(a){return '<table><tr><th>Kod</th><th>Nazwa</th></tr>'+a.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td></tr>`).join('')+'</table>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function runAll(){out.innerHTML='<p>Uruchamiam testy…</p>';await testWfs();await testWfsBbox();await testUldk()}</script></body></html>
