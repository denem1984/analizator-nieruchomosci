<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostyka obrębów V2 – ULDK</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:20px auto;padding:0 16px;background:#f8fafc;color:#172033}button{padding:10px 14px;margin:4px;border:0;border-radius:7px;background:#2563eb;color:#fff;cursor:pointer}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;padding:14px;border-radius:8px;max-height:420px;overflow:auto}.ok{color:#166534}.err{color:#991b1b}.warn{color:#92400e}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:7px;text-align:left}small{color:#64748b}</style></head><body><h1>Diagnostyka obrębów V2 – ULDK</h1><p>Ten tester <b>nie zmienia aplikacji głównej</b>. Sprawdza, czy ULDK może być wykorzystane do ustalenia listy obrębów dla gminy Pisz.</p><button onclick="runAll()">▶ Uruchom wszystkie testy</button><button onclick="testExact()">ULDK – konkretne obręby</button><button onclick="testVariants()">ULDK – identyfikatory nadrzędne</button><div id="out"></div><script>const U='https://uldk.gugik.gov.pl/';function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function card(t,ok,b){out.innerHTML+=`<div class="card"><h2>${t}</h2><div class="${ok?'ok':'err'}">${ok?'OK':'BŁĄD'}</div>${b}</div>`}async function call(request,id){let u=new URL(U);u.searchParams.set('request',request);u.searchParams.set('id',id);u.searchParams.set('result','id,teryt,region,commune,county');let t=Date.now(),r=await fetch(u),text=await r.text();return{status:r.status,text,ms:Date.now()-t,url:u.toString()}}async function testExact(){let ids=['281603_4.0001','281603_4.0002','281603_5.0001'];let rows='',ok=true;for(let id of ids){try{let x=await call('GetRegionById',id);let good=x.status===200&&!/^0\s*$/.test(x.text.trim());if(!good)ok=false;rows+=`<tr><td>${id}</td><td>${x.status}</td><td>${x.ms} ms</td><td><pre>${esc(x.text.slice(0,1500))}</pre></td></tr>`}catch(e){ok=false;rows+=`<tr><td>${id}</td><td>FETCH ERROR</td><td colspan="2">${esc(e.message)}</td></tr>`}}card('ULDK – konkretne obręby',ok,`<p>Sprawdzamy znane, prawidłowe identyfikatory obrębów Pisz.</p><table><tr><th>ID</th><th>HTTP</th><th>Czas</th><th>Odpowiedź</th></tr>${rows}</table>`)}async function testVariants(){let ids=['281603_3','281603_4','281603_5','Pisz'];let rows='',ok=true;for(let id of ids){try{let x=await call('GetRegionByNameOrId',id);let good=x.status===200&&!/^0\s*$/.test(x.text.trim());if(!good)ok=false;rows+=`<tr><td>${id}</td><td>${x.status}</td><td>${x.ms} ms</td><td><pre>${esc(x.text.slice(0,4000))}</pre></td></tr>`}catch(e){ok=false;rows+=`<tr><td>${id}</td><td>FETCH ERROR</td><td colspan="2">${esc(e.message)}</td></tr>`}}card('ULDK – identyfikatory nadrzędne / nazwa',ok,`<p>Najważniejszy test: sprawdzamy, czy ULDK potrafi zwrócić obręby po kodzie gminy albo nazwie.</p><table><tr><th>Zapytanie ID</th><th>HTTP</th><th>Czas</th><th>Odpowiedź</th></tr>${rows}</table><p class="warn"><b>Interpretacja:</b> jeżeli <code>281603_3</code> zwróci listę obrębów, mamy prostą i działającą ścieżkę bez WFS. Jeżeli nie, wynik pokaże dokładnie, czego ULDK wymaga.</p>`)}async function runAll(){out.innerHTML='<p>Uruchamiam testy…</p>';await testExact();await testVariants()}</script></body></html>
