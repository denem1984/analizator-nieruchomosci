<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tester WFS własności – Pisz v2</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{height:100%;margin:0;font-family:Arial,sans-serif}body{display:flex}.panel{width:470px;box-sizing:border-box;padding:16px;overflow:auto;background:#fff;border-right:1px solid #bbb}.map{flex:1;min-width:0}.btn{width:100%;padding:11px;margin:5px 0;border:1px solid #8aa4c8;border-radius:7px;background:#f7f9fc;font-size:14px;font-weight:700;cursor:pointer}.primary{background:#2463df;color:#fff}.status{padding:10px;margin:8px 0;border-radius:7px;background:#eef7f0}.row{padding:9px 0;border-bottom:1px solid #ddd;font-size:13px;line-height:1.4}.ok{color:#075b2c;background:#effaf2}.zero{color:#8a1111}.bad{color:#8a1111;background:#ffe8e8}.small{font-size:12px;color:#555}code{word-break:break-all}</style></head><body><div class="panel"><h1>Tester WFS własności – Pisz v2</h1><p class="small">Izolowany test. Nie zmienia produkcji ani etykiet działek.</p><button class="btn primary" id="run">URUCHOM WSZYSTKIE TESTY</button><button class="btn" id="clear">WYCZYŚĆ</button><div id="status" class="status">Testujemy warianty BBOX dla działek WFS.</div><div id="results"></div><p class="small">Źródło: <code>https://powiatpiski.geoportal2.pl/map/geoportal/wfs.php</code></p></div><div id="map" class="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const WFS='https://powiatpiski.geoportal2.pl/map/geoportal/wfs.php';const map=L.map('map').setView([53.62,21.82],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);function tm(lat,lon,zone,scale=.999923,north=0){const R=6378137,e=.0818191910426,C0=zone*3*Math.PI/180,B=lat*Math.PI/180,L=lon*Math.PI/180,d=L-C0,N=R/Math.sqrt(1-e*e*Math.sin(B)**2),T=Math.tan(B)**2,C=e*e/(1-e*e)*Math.cos(B)**2,A=Math.cos(B)*d,M=R*((1-e*e/4-3*e**4/64-5*e**6/256)*B-(3*e*e/8+3*e**4/32+45*e**6/1024)*Math.sin(2*B)+(15*e**4/256+45*e**6/1024)*Math.sin(4*B)-(35*e**6/3072)*Math.sin(6*B));return[zone*1000000+500000+scale*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*e*e/(1-e*e))*A**5/120),scale*(M+N*Math.tan(B)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*e*e/(1-e*e))*A**6/720))+north]}function project(lat,lon,crs){if(crs==='2178')return tm(lat,lon,7);return tm(lat,lon,6,.9993,-5300000)}function bounds(crs){const b=map.getBounds(),a=project(b.getSouth(),b.getWest(),crs),c=project(b.getNorth(),b.getEast(),crs);return{minX:Math.min(a[0],c[0]),minY:Math.min(a[1],c[1]),maxX:Math.max(a[0],c[0]),maxY:Math.max(a[1],c[1])}}function addResult(name,text,cls=''){const e=document.createElement('div');e.className='row '+cls;e.innerHTML='<b>'+name+'</b><br>'+text;document.getElementById('results').appendChild(e)}async function test(name,params){const u=new URL(WFS);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);const t=performance.now();try{const r=await fetch(u.href,{headers:{Accept:'application/xml,text/xml,*/*'}});const text=await r.text();const matched=text.match(/numberMatched="([^"]+)"/i)?.[1];const returned=text.match(/numberReturned="([^"]+)"/i)?.[1];const ok=r.ok&&((matched&&matched!=='0')||(returned&&returned!=='0'));addResult(name,'HTTP '+r.status+' · '+(r.headers.get('content-type')||'')+' · '+Math.round(performance.now()-t)+' ms<br>numberMatched: <b>'+(matched??'—')+'</b> · numberReturned: <b>'+(returned??'—')+'</b><br><code>'+u.href+'</code>',ok?'ok':r.ok?'zero':'bad')}catch(e){addResult(name,'BŁĄD przeglądarki: '+e.message,'bad')}}async function run(){document.getElementById('results').innerHTML='';document.getElementById('status').textContent='Uruchamiam 7 wariantów…';const b2180=bounds('2180'),b2178=bounds('2178');const q=(b)=>[b.minX.toFixed(2),b.minY.toFixed(2),b.maxX.toFixed(2),b.maxY.toFixed(2)].join(',');const qSwap=(b)=>[b.minY.toFixed(2),b.minX.toFixed(2),b.maxY.toFixed(2),b.maxX.toFixed(2)].join(',');await test('1. EPSG:2178 BBOX bez CRS w BBOX',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2178',bbox:q(b2178),count:'10'});await test('2. EPSG:2180 BBOX + CRS w parametrze',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2180',bbox:q(b2180)+',EPSG:2180',count:'10'});await test('3. EPSG:2178 BBOX + CRS w parametrze',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2178',bbox:q(b2178)+',EPSG:2178',count:'10'});await test('4. EPSG:2180 zamienione osie',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2180',bbox:qSwap(b2180),count:'10'});await test('5. EPSG:2178 zamienione osie',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2178',bbox:qSwap(b2178),count:'10'});await test('6. EPSG:2180 BBOX + propertyName',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2180',bbox:q(b2180),propertyName:'id_dzialki,grupa_rejestrowa,geom',count:'10'});await test('7. KONTROLA – bez BBOX',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2180',count:'10'});document.getElementById('status').textContent='Gotowe. Szukamy pierwszego wariantu z numberMatched > 0.'}document.getElementById('run').onclick=run;document.getElementById('clear').onclick=()=>{document.getElementById('results').innerHTML='';document.getElementById('status').textContent='Wyczyszczono.'}</script></body></html>
