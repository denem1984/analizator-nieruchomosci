<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tester WFS własności – Pisz</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{height:100%;margin:0;font-family:Arial,sans-serif}body{display:flex}.panel{width:430px;box-sizing:border-box;padding:16px;overflow:auto;background:#fff;border-right:1px solid #bbb}.map{flex:1;min-width:0}.btn{width:100%;padding:11px;margin:5px 0;border:1px solid #8aa4c8;border-radius:7px;background:#f7f9fc;font-size:14px;font-weight:700;cursor:pointer}.primary{background:#2463df;color:#fff}.status{padding:10px;margin:8px 0;border-radius:7px;background:#eef7f0}.bad{background:#ffe8e8;color:#8a1111}.row{padding:9px 0;border-bottom:1px solid #ddd;font-size:13px;line-height:1.4}.ok{color:#075b2c}.zero{color:#8a1111}.small{font-size:12px;color:#555}code{word-break:break-all}</style></head><body><div class="panel"><h1>Tester WFS własności – Pisz</h1><p class="small">Izolowany test. Nie zmienia produkcji ani etykiet działek.</p><button class="btn primary" id="run">URUCHOM WSZYSTKIE TESTY</button><button class="btn" id="clear">WYCZYŚĆ</button><div id="status" class="status">Gotowy. Centrum: okolice Rucianego-Nidy.</div><div id="results"></div><p class="small">Źródło: <code>https://powiatpiski.geoportal2.pl/map/geoportal/wfs.php</code></p></div><div id="map" class="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const WFS='https://powiatpiski.geoportal2.pl/map/geoportal/wfs.php';const map=L.map('map').setView([53.62,21.82],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);L.rectangle([[53.60,21.79],[53.64,21.85]],{weight:1}).addTo(map);function bbox2180(){const b=map.getBounds();const p=boundsTo2180(b);return p}function boundsTo2180(b){const R=6378137,lon0=19*Math.PI/180,k=.9993,x0=500000,y0=-5300000,e=0.0818191910426;function f(lat,lon){let B=lat*Math.PI/180,L=lon*Math.PI/180;let dl=L-lon0;let N=R/Math.sqrt(1-e*e*Math.sin(B)**2);let T=Math.tan(B)**2,C=e*e/(1-e*e)*Math.cos(B)**2;let A=Math.cos(B)*dl;let M=R*((1-e*e/4-3*e**4/64-5*e**6/256)*B-(3*e*e/8+3*e**4/32+45*e**6/1024)*Math.sin(2*B)+(15*e**4/256+45*e**6/1024)*Math.sin(4*B)-(35*e**6/3072)*Math.sin(6*B));let x=x0+k*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*e*e/(1-e*e))*A**5/120);let y=y0+k*(M+N*Math.tan(B)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*e*e/(1-e*e))*A**6/720));return[x,y]}const a=f(b.getSouth(),b.getWest()),c=f(b.getNorth(),b.getEast());return{minX:Math.min(a[0],c[0]),minY:Math.min(a[1],c[1]),maxX:Math.max(a[0],c[0]),maxY:Math.max(a[1],c[1])}}function addResult(name,text,cls=''){const e=document.createElement('div');e.className='row '+cls;e.innerHTML='<b>'+name+'</b><br>'+text;document.getElementById('results').appendChild(e)}async function test(name,params){const u=new URL(WFS);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);const t=performance.now();try{const r=await fetch(u.href,{headers:{Accept:'application/json,application/xml,text/xml,*/*'}});const text=await r.text();let matched=text.match(/numberMatched="([^"]+)"/i)?.[1];let returned=text.match(/numberReturned="([^"]+)"/i)?.[1];let jsonCount;try{const j=JSON.parse(text);jsonCount=Array.isArray(j.features)?j.features.length:null}catch{}addResult(name,'HTTP '+r.status+' · '+(r.headers.get('content-type')||'')+' · '+Math.round(performance.now()-t)+' ms<br>numberMatched: <b>'+(matched??'—')+'</b> · numberReturned: <b>'+(returned??'—')+'</b>'+(jsonCount!=null?' · features: <b>'+jsonCount+'</b>':'')+'<br><code>'+u.href+'</code>',r.ok&&((matched&&matched!=='0')||(returned&&returned!=='0')||jsonCount>0)?'ok':r.ok?'zero':'bad')}catch(e){addResult(name,'BŁĄD przeglądarki: '+e.message,'bad')}}async function run(){document.getElementById('results').innerHTML='';document.getElementById('status').className='status';document.getElementById('status').textContent='Uruchamiam 5 wariantów…';const b=bbox2180();const bbox=b.minX.toFixed(2)+','+b.minY.toFixed(2)+','+b.maxX.toFixed(2)+','+b.maxY.toFixed(2);await test('1. BBOX + bez propertyName',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2180',bbox,count:'10'});await test('2. BBOX + id_dzialki,geom',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2180',bbox,propertyName:'id_dzialki,geom',count:'10'});await test('3. BBOX + grupa_rejestrowa',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2180',bbox,propertyName:'id_dzialki,grupa_rejestrowa,geom',count:'10'});await test('4. Bez BBOX',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:2180',count:'10'});const b4326=[map.getBounds().getWest(),map.getBounds().getSouth(),map.getBounds().getEast(),map.getBounds().getNorth()].join(',');await test('5. BBOX EPSG:4326',{service:'WFS',version:'2.0.0',request:'GetFeature',typenames:'ewns:dzialki',srsName:'EPSG:4326',bbox:b4326,count:'10'});document.getElementById('status').textContent='Test zakończony. Interesuje nas przede wszystkim wariant, który zwróci numberMatched > 0.'}document.getElementById('run').onclick=run;document.getElementById('clear').onclick=()=>{document.getElementById('results').innerHTML='';document.getElementById('status').textContent='Wyczyszczono.'}</script></body></html>
